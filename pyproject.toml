[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diag-opt"
version = "0.1.0"
description = "Otimização de modelos de diagnóstico via Algoritmo Genético + interpretação com LLM (Tech Challenge Fase 2 — FIAP Postech)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Grupo Tech Challenge - FIAP Postech IA para Devs" }]
dependencies = [
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "shap>=0.43.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "pytest-cov>=4.1.0", "jupyter>=1.0.0", "ipykernel>=6.0.0"]

[project.scripts]
diag-opt = "diag_opt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["diag_opt"]
